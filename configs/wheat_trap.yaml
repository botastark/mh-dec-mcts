# Real orthomap field (wheat annotations, 60 m x 110 m at 1 m cells), the shape where greedy IG has
# been seen to get trapped at a local maximum. The two swarm settings, 4 UAVs from the corners.
# Benchmark for planners that should not get trapped (myopia.py reports dwell / trapped runs):
#   python scripts/myopia.py configs/wheat_trap.yaml --setting IGd_BM_R5 --runs 20 --jobs 8 --n 1 \
#       --planners greedy decmcts:horizon=8,rollout=greedy,lbp_model=false
#   python scripts/myopia.py configs/wheat_trap.yaml --setting IGd_BM_R5 --runs 20 --jobs 8 \
#       --planners greedy decmcts:horizon=8,rollout=greedy,lbp_model=false
name: wheat_trap
seed: 42
compat: null

grid:    {size_x: 60, size_y: 110, cell: 1.0}
lattice: {xy_step: 4.0, h_min: 19.5, h_step: null, n_alt: 6, fov_deg: 60}   # 16 x 28 waypoints
field:
  type: orthomap
  annotations: data/annotation.txt
  crop: [3, 113, 13, 73]
  positive_labels: [1, 2, 10]
sensor:  {type: theoretical, a: 1.0, b: 0.015}
agents:  {n: 4, start: legacy}
run:     {weights: adaptive, steps: 100, runs: 20}

settings:
  IG_BS_Rinf: {range: 32, sharing: BS, greedy: ig}
  IGd_BM_R5:  {range: 5,  sharing: BM, greedy: igd}

planners: [greedy, decmcts]

mcts:
  variant: single
  horizon: 8
  iterations: 10
  rollouts: 10
  gamma: 0.99
  rollout: greedy
  lbp_model: false
